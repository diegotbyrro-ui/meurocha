<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="rocha-upper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa7280" stop-opacity=".17"/>
      <stop offset=".48" stop-color="#f94b5e" stop-opacity=".11"/>
      <stop offset="1" stop-color="#8f1426" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="rocha-diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa717a" stop-opacity=".23"/>
      <stop offset=".52" stop-color="#dc3246" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b91d33" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="rocha-leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f24a58" stop-opacity=".15"/>
      <stop offset="1" stop-color="#a0162a" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="lower-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d42c44" stop-opacity=".11"/>
      <stop offset=".56" stop-color="#aa1028" stop-opacity=".18"/>
      <stop offset="1" stop-color="#270208" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="under-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec344c" stop-opacity=".11"/>
      <stop offset="1" stop-color="#4c0611" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="warm-ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dd253c" stop-opacity="0"/>
      <stop offset=".31" stop-color="#f04a54" stop-opacity=".065"/>
      <stop offset=".58" stop-color="#f44f5c" stop-opacity=".18"/>
      <stop offset=".74" stop-color="#ff816c" stop-opacity=".62"/>
      <stop offset=".88" stop-color="#ffddac" stop-opacity="1"/>
      <stop offset=".945" stop-color="#ff8b6d" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fb6577" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="center-light" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#f3374e" stop-opacity=".19"/>
      <stop offset=".44" stop-color="#cd223f" stop-opacity=".055"/>
      <stop offset="1" stop-color="#8b071a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-15%" y="-600%" width="130%" height="1300%">
      <feGaussianBlur stdDeviation="6.2"/>
    </filter>
  </defs>

  <!-- Halo difuso central para dar profundidade, sem achatar o vermelho vinho. -->
  <ellipse cx="805" cy="3" rx="510" ry="302" fill="url(#center-light)"/>

  <!-- Simbolo R ROCHA: topologia vetorial separada em 3 facetas, conforme
       os volumes oficiais vermelho/escuro do logotipo. Sem bitmaps ou mascara PNG. -->
  <g id="rocha-r-oficial-marca-dagua" transform="translate(17 157) scale(1.036 1.043)">
    <path d="M28 19 H127 C174 19 207 56 207 105 C207 138 191 167 162 187 Z"
          fill="url(#rocha-upper)"/>
    <path d="M28 136 L101 228 L28 282 Z" fill="url(#rocha-leg)"/>
    <path d="M28 19 L232 282 H147 L28 134 Z" fill="url(#rocha-diagonal)"/>
    <path d="M28.5 19.5 H126 C170 19.5 205.5 54 206.5 104"
          fill="none" stroke="#ff8190" stroke-opacity=".065" stroke-width=".9"/>
    <path d="M28 137 L100 228" fill="none" stroke="#25040b"
          stroke-opacity=".18" stroke-width=".7"/>
  </g>

  <!-- Faixas sobrepostas: textura arquitetonica suave, como na arte aprovada. -->
  <path d="M-80 354 C150 402 281 476 572 454 C807 437 940 442 1141 390
           C1320 346 1438 260 1692 249 L1692 530 L-80 530Z"
        fill="url(#lower-ribbon)"/>
  <path d="M-60 412 C204 485 420 505 668 475 C910 446 1118 399 1355 352
           C1505 322 1582 306 1670 286 L1670 520 L-60 520Z"
        fill="url(#under-wave)"/>
  <path d="M246 372 C525 458 797 460 1062 415 C1252 382 1414 301 1664 265"
        fill="none" stroke="#f05060" stroke-opacity=".085" stroke-width="32"/>

  <!-- Filete luminoso curvo: halo largo e linha estreita com brilho localizado. -->
  <path d="M260 370 C534 460 813 456 1089 407 C1289 371 1467 289 1666 259"
        fill="none" stroke="#ff7966" stroke-width="16" opacity=".26"
        filter="url(#soft-glow)"/>
  <path d="M260 370 C534 460 813 456 1089 407 C1289 371 1467 289 1666 259"
        fill="none" stroke="url(#warm-ray)" stroke-width="1.75" opacity=".96"/>
  <path d="M293 398 C583 475 846 470 1130 422 C1348 383 1534 328 1692 314"
        fill="none" stroke="#ff6d70" stroke-opacity=".095" stroke-width="1.3"/>

  <!-- Contornos elegantes no extremo direito, sem interferir na coluna de links. -->
  <g fill="none" stroke="#e9ac83" stroke-width="1.1" stroke-opacity=".25">
    <path d="M1515 -45 L1392 105 Q1375 126 1405 126 L1640 126"/>
    <path d="M1588 -32 L1463 132 Q1445 157 1480 157 L1690 157"/>
    <path d="M1660 173 L1500 289 Q1476 306 1516 306 L1710 306"/>
  </g>
</svg>
